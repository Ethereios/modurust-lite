[package]
name = "modurust_core"
version = "0.1.0"
edition = "2021"

[dependencies]
cpal = "0.15"
midir = "0.9"
rosc = "0.8"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-complex = "0.4"
ndarray = "0.15"
notify = "6.1"
ort = { version = "2.0.0-rc.13", optional = true }

[features]
default = []
onnx = ["ort"]
