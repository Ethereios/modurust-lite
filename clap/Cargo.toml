[package]
name = "modurust-clap"
version = "0.1.0"
edition = "2021"
description = "Modurust CLAP plugin wrapper for Modurust-Lite headless audio engine"
license = "MIT"
repository = "https://github.com/YOUR_USERNAME/modurust-vst3"
authors = ["Modurust"]

[lib]
name = "modurustclap"
crate-type = ["cdylib"]

[dependencies]
clap-sys = "0.3"
modurust_core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"