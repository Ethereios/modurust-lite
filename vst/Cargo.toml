[package]
name = "modurust-vst"
version = "0.1.0"
edition = "2021"
description = "Modurust VST2 plugin wrapper for Modurust-Lite headless audio engine"
license = "MIT"
repository = "https://github.com/YOUR_USERNAME/modurust-vst3"
authors = ["Modurust"]

[lib]
name = "modurustvst"
crate-type = ["cdylib"]

[dependencies]
vst = "0.4"
modurust_core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"